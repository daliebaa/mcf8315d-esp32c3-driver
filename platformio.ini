;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
;串口配置
monitor_speed = 115200
upload_speed = 115200
build_flags = 
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
;Serial.begin need to delay 5000ms to wait for the serial port to initialize, otherwise it will cause the serial monitor to not display any information. This is because the ESP32-C3 has a built-in USB-to-serial converter that takes some time to initialize after reset. By adding a delay of 5000ms (5 seconds) after Serial.begin, we can ensure that the serial port is ready before we start sending data to the serial port.
;If you want to see the serial output immediately after reset, you can reduce the delay time, but make sure to give enough time for the USB-to-serial converter to initialize. A delay of around 2000ms (2 seconds) is usually sufficient for most cases. However, if you are experiencing issues with the serial monitor not displaying information, you can try increasing the delay time until you find a suitable value that works for your specific setup.
